[phases.setup]
nixPkgs = [
  "php82",
  "php82Extensions.pdo",
  "php82Extensions.pdo_mysql",
  "php82Extensions.mbstring",
  "php82Extensions.tokenizer",
  "php82Extensions.xml",
  "php82Extensions.ctype",
  "php82Extensions.bcmath",
  "php82Extensions.gd",
  "php82Extensions.opcache"
]

[phases.install]
cmds = [
  "curl -sS https://getcomposer.org/installer -o composer-setup.php && php composer-setup.php && mv composer.phar /usr/local/bin/composer && chmod +x /usr/local/bin/composer",
  "/usr/local/bin/composer install --no-dev --optimize-autoloader --ignore-platform-req=ext-gd"
]

[phases.build]
cmds = [
  "php artisan config:cache",
  "php artisan view:cache"
]

[start]
cmd = "php artisan migrate --force && php artisan serve --host=0.0.0.0 --port=$PORT"